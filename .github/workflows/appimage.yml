# Build the AppImage on every push and pull request. Pushes to main also
# publish it to the GitHub release tagged `release` (replacing its assets),
# which is where installed AppImages update from (lib/src/update.dart, or AppImageUpdate via the embedded
# zsync update information). The conda package is built by package.yml.
name: AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appimage:
    # The oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    env:
      OUTPUT: ghostnim-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache libghostty-vt
        id: vt-cache
        uses: actions/cache@v4
        with:
          path: vendor/ghostty-vt
          key: ghostty-vt-${{ runner.os }}-${{ hashFiles('scripts/build-libghostty-vt.sh') }}

      # The prebuilt one from the libghostty-vt release (rebuilt by
      # libghostty-vt.yml whenever the pinned Ghostty commit changes), else
      # built here.
      - uses: mlugg/setup-zig@v2
        if: steps.vt-cache.outputs.cache-hit != 'true'
        with:
          version: 0.16.0
      - name: Get libghostty-vt
        if: steps.vt-cache.outputs.cache-hit != 'true'
        run: sh scripts/fetch-libghostty-vt.sh || sh scripts/build-libghostty-vt.sh

      - name: Test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build AppImage
        env:
          FLUTTER_FLAGS: --dart-define=AUTO_UPDATE=true --dart-define=UPDATE_REPO=${{ github.repository }}
          UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|release|ghostnim-x86_64.AppImage.zsync
        run: |
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)+${{ github.run_number }}" \
            sh scripts/build-appimage.sh
          ls -l "$OUTPUT" "$OUTPUT.zsync"

      - name: Smoke test
        # GTK needs a display even to print --help.
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./"$OUTPUT" --help | grep "^Usage: ghostnim"

      - uses: actions/upload-artifact@v4
        with:
          name: ghostnim-appimage
          path: |
            ${{ env.OUTPUT }}
            ${{ env.OUTPUT }}.zsync

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A single release under the fixed `release` tag: move the tag to
          # this commit and replace the assets, so the download URLs never
          # change.
          tag=release
          title="ghostnim $(date -u +%Y-%m-%d) #${{ github.run_number }} (${GITHUB_SHA::7})"
          notes="Automated build of ${GITHUB_SHA::7}. Installed AppImages update to this release on their own."
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$OUTPUT" "$OUTPUT.zsync" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" "$OUTPUT" "$OUTPUT.zsync" \
              --verify-tag --title "$title" --notes "$notes" --latest
          fi

      - name: Remove versioned releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Earlier builds were published as one release per build
          # (build-YYYYMMDD-N); delete them along with their tags.
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            grep -v '^release$' |
            xargs -r -n1 gh release delete --cleanup-tag --yes
